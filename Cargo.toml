[package]
name = "contort"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Deformed Reed-Solomon codes: twisted / folded / interleaved GRS and Roth-Lempel"
license = "MIT"
repository = "https://github.com/nanithefkuc/contort"

[features]
default = ["std", "simd"]
std = ["gs-engine/std", "fgf/std", "butterfly-fft/std"]
simd = ["std", "gs-engine/simd", "fgf/simd", "butterfly-fft/simd"]
# Unstable implementation APIs for benchmarking and downstream
# experimentation. Not covered by any compatibility promise.
internals = []

[dependencies]
gs-engine = { git = "https://github.com/nanithefkuc/gs-engine", rev = "7cc629aadc1f6d12b489176bbd45ee3389510dd4", default-features = false }
fgf = { git = "https://github.com/nanithefkuc/fgf", rev = "d0e331cec2e6ae5645e529597fa913db467a44cd", default-features = false }
butterfly-fft = { git = "https://github.com/nanithefkuc/butterfly-fft", rev = "6b3f52485bfff2664d6b0c92452137e618a60932", default-features = false }
