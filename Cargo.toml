[package]
name = "contort"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Deformed Reed-Solomon codes: twisted / folded / interleaved GRS and Roth-Lempel"
license = "MIT"
repository = "https://github.com/nanithefkuc/contort"

[features]
default = ["std", "simd"]
std = ["poly-ring/std", "gs-engine/std", "fgf/std", "butterfly-fft/std"]
simd = ["std", "poly-ring/simd", "gs-engine/simd", "fgf/simd", "butterfly-fft/simd"]
# Unstable implementation APIs for benchmarking and downstream
# experimentation. Not covered by any compatibility promise.
internals = []

[dependencies]
gs-engine = { git = "https://github.com/nanithefkuc/gs-engine", rev = "2f51e8fb9fecef5b713c6b6f94b68faa5abf6bdd", default-features = false }
# The same landed field/transform/ring sources the engine resolves, so one
# copy of each compiles across the closure.
poly-ring = { git = "https://github.com/nanithefkuc/poly-ring", rev = "48f7e8fe8a2f637e18c4fbd241849461404e21c2", default-features = false, features = ["fft"] }
fgf = { git = "https://github.com/nanithefkuc/fgf", rev = "68cae1fa058e1900e24b9eb564efeb0189ad0f78", default-features = false }
butterfly-fft = { git = "https://github.com/nanithefkuc/butterfly-fft", rev = "fec2cb8afabf13d79b6bc2f516ee04235363ceae", default-features = false }

[dev-dependencies]
# Default features pull in plotters + rayon, which this harness does not use.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "encoder"
harness = false

[[bench]]
name = "decoder"
harness = false

# Release codegen a profiler can attribute: opt-level 3 with full debug info
# and no symbol stripping. Frame pointers come from RUSTFLAGS in `just
# profile-perf`, since they are not a Cargo profile key.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
