name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job drives the vendored `justfile`, so a green `just validate` locally
# is the same command set CI runs. No miri job: `MIRI` in crate.just is empty
# because the crate declares no unsafe surface.
jobs:
  lint:
    name: fmt, clippy, doc, deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just lint
      - run: just doc
      - run: just deps

  test:
    name: feature closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # no-default (the no_std closure), default, then all features.
      - run: just features

  # Dispatch resolves one backend per process, so the host run only exercises
  # the host's best. `just test-tiers` re-runs the suite once per declared tier.
  backends:
    name: backend sweep (v3, v2, scalar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just test-tiers

  msrv:
    name: msrv 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain name must match `MSRV` in crate.just: `just msrv` runs
      # `cargo +1.89`.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just msrv

  # Ground rule 6: line coverage of the crate's own source stays at or above
  # 95%. `just cover` merges one run per backend tier and enforces the gate.
  coverage:
    name: coverage >=95% (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just cover
      # The recipe prints and gates but writes no file; re-report the merged
      # profile as lcov for the artifact.
      - run: cargo llvm-cov report --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage.lcov
